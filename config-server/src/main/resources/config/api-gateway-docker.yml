server:
  port: 8080

eureka:
  instance:
    hostname: api-gateway
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          # Enable automatic routing using Eureka service names
          discovery:
            locator:
              enabled: true

          # Routes of microservices
          routes:
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/product/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/order/**

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**

            # For Eureka web UI through API Gateway ( Cannot view service status without this )
            - id: discovery-server
              uri: http://discovery-server:8761
              predicates:
                - Path=/eureka/web
              filters:
                - SetPath=/

            - id: discovery-server-static
              uri: http://discovery-server:8761
              predicates:
                - Path=/eureka/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    org.springframework.cloud.gateway: TRACE
